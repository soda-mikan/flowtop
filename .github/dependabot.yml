version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      userspace-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
  - package-ecosystem: cargo
    directory: "/flowtop-ebpf"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ebpf-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
