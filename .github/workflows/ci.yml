name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  userspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features

  ebpf-object:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
          components: rust-src, rustfmt, clippy
      - run: cargo install bpf-linker --version 0.10.4 --locked
      - run: cargo +nightly fmt --manifest-path flowtop-ebpf/Cargo.toml -- --check
      - run: cargo +nightly clippy --manifest-path flowtop-ebpf/Cargo.toml --locked -Z build-std=core --target bpfel-unknown-none -- -D warnings
      - run: ./scripts/build-ebpf.sh
      - run: file target/release/flowtop-ebpf.o | grep 'eBPF'
