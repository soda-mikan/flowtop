[workspace]
members = ["flowtop-common", "flowtop"]
exclude = ["flowtop-ebpf"]
resolver = "2"

[workspace.package]
version = "0.0.1-beta"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/soda-mikan/flowtop"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
aya = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
csv = "1.4"
humantime = "2.3"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
